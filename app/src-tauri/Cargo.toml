[package]
name = "mado"
version = "0.0.0" # Mado's version lives in app/package.json (see docs/releasing.md)
description = "Mado's desktop shell: the window, the engine process and updates."
edition = "2024"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"

[target.'cfg(windows)'.dependencies]
# File Explorer's "Open in Mado" and Open with, under HKCU (open_in_mado.rs).
windows-registry = "0.100.0"
# The files copied in File Explorer (clipboard.rs), and a second start finding the first.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
